name: test dev branch

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "datas/**"
      - "docs/**"
      - "README.md"
      - "*.md"

jobs:
  # 1. Setup development environment
  setup-dev-environment:
    runs-on: ubuntu-latest

    steps:
      # 1.1 Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 1.2 Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 1.3 Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

  # 2. Run linting
  run_linting:
    runs-on: ubuntu-latest
    needs: setup-dev-environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # 2.1 Run flake8
      - name: Run flake8
        run: flake8 src --max-line-length=120

      # 2.2 Run ruff
      - name: Run ruff
        run: ruff check src tests --line-length=120
  # 3. Run tests
  run_tests:
    runs-on: ubuntu-latest
    needs: run_linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # 3.1 Run tests
      - name: Run tests with pytest
        run: pytest --cov=src --cov-report=html

      # 3.2 Upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./htmlcov

  # 4. Build and deploy to private PyPI
  deploy-to-pypi:
    runs-on: ubuntu-latest
    needs: run_tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Increment version
        id: increment_version
        run: |
          # Lire la version actuelle
          CURRENT_VERSION=$(grep -oP 'version = "\K[^"]+' pyproject.toml)
          echo "Current version: $CURRENT_VERSION"

          # Séparer les composants de la version (MAJOR.MINOR.PATCH)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Incrémenter le PATCH
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"

          # Mettre à jour pyproject.toml
          sed -i "s/version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml

          # Exporter la nouvelle version pour les étapes suivantes
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.increment_version.outputs.new_version }}"
          git push

      - name: Build package
        run: python -m build

      - name: Upload to private PyPI
        run: |
          twine upload --repository-url https://pylib.shooterlab.fr/ -u "" -p "" dist/*
