name: test dev branch

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "datas/**"
      - "docs/**"
      - "README.md"
      - "*.md"

jobs:
  # 1. Setup development environment
  setup-dev-environment:
    runs-on: ubuntu-latest

    steps:
      # 1.1 Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 1.2 Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 1.3 Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

  # 2. Run linting
  run_linting:
    runs-on: ubuntu-latest
    needs: setup-dev-environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # 2.1 Run flake8
      - name: Run flake8
        run: flake8 src --max-line-length=120

      # 2.2 Run ruff
      - name: Run ruff
        run: ruff check src tests --line-length=120

  # 3. Run tests
  run_tests:
    runs-on: ubuntu-latest
    needs: run_linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # 3.1 Run tests
      - name: Run tests with pytest
        run: pytest --cov=src --cov-report=html

      # 3.2 Upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./htmlcov
